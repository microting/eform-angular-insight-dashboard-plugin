<div id="copyableChart{{chartPosition}}"
     *ngIf="itemModel.chartType === chartTypes.Pie ||
            itemModel.chartType === chartTypes.PieGrid"
     [ngStyle]="{'width': pieView[0] + 'px' }" [style.background-color]="darkTHeme ? '' : '#FFFFFF' + '!important;'">
  <div [ngStyle]="{'width': pieView[0] + 'px', 'height': pieView[1] + 'px'}">
    <!--    <ngx-charts-pie-chart *ngIf="itemModel.chartType === chartTypes.Pie"-->
    <!--                          [view]="view"-->
    <!--                          [scheme]="colorScheme"-->
    <!--                          [legendPosition]="legendPosition"-->
    <!--                          [customColors]="customColors"-->
    <!--                          [results]="itemModel.chartData.single"-->
    <!--                          [legend]="true"-->
    <!--                          [explodeSlices]="false"-->
    <!--                          [labels]="true"-->
    <!--                          [doughnut]="false"-->
    <!--                          [gradient]="false">-->
    <!--    </ngx-charts-pie-chart>-->
    <ngx-charts-advanced-pie-chart
      *ngIf="itemModel.chartType === chartTypes.Pie"
      [view]="pieView"
      [customColors]="customColors"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.single"
      [percentageFormatting]="percentageFormatting"
      [gradient]="false">
    </ngx-charts-advanced-pie-chart>
    <ngx-charts-pie-grid
      *ngIf="itemModel.chartType === chartTypes.PieGrid"
      [view]="pieView"
      [customColors]="customColors"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.single">
    </ngx-charts-pie-grid>
  </div>
</div>

<div id="copyableChart{{chartPosition}}"
     *ngIf="itemModel.chartType === chartTypes.HorizontalBar ||
            itemModel.chartType === chartTypes.HorizontalBarGrouped ||
            itemModel.chartType === chartTypes.HorizontalBarStacked "
     [ngStyle]="{'width': horizontalView[0] + 'px' }" [style.background-color]="darkTHeme ? '' : '#FFFFFF' + '!important;'">
  <div [ngStyle]="{'width': horizontalView[0] + 'px' }">
    <ngx-charts-bar-horizontal
      *ngIf="itemModel.chartType === chartTypes.HorizontalBar"
      [view]="horizontalView"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.single"
      [customColors]="customColors"
      [barPadding]="barPadding"
      [legendPosition]="legendPosition"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="false"
      [xAxisLabel]="'Percents' | translate" [xScaleMax]="100">
    </ngx-charts-bar-horizontal>
    <ngx-charts-bar-horizontal-stacked
      *ngIf="itemModel.chartType === chartTypes.HorizontalBarStacked"
      [view]="horizontalView"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.multi"
      [customColors]="customColors"
      [legendPosition]="legendPosition"
      [barPadding]="barPadding"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="false"
      [xAxisLabel]="'Percents' | translate" [xScaleMax]="100">
    </ngx-charts-bar-horizontal-stacked>
    <ngx-charts-bar-horizontal-2d
      *ngIf="itemModel.chartType === chartTypes.HorizontalBarGrouped"
      [view]="horizontalView"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.multi"
      [customColors]="customColors"
      [legendPosition]="legendPosition"
      [barPadding]="barPadding"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="false"
      [xAxisLabel]="'Percents' | translate" [xScaleMax]="100">
    </ngx-charts-bar-horizontal-2d>
  </div>
</div>

<div id="copyableChart{{chartPosition}}"
     *ngIf="itemModel.chartType === chartTypes.VerticalBar ||
            itemModel.chartType === chartTypes.VerticalBarGrouped ||
            itemModel.chartType === chartTypes.Line ||
            itemModel.chartType === chartTypes.VerticalBarStacked"
     [ngStyle]="{'width': verticalView[0] + 'px' }" [style.background-color]="darkTHeme ? '' : '#FFFFFF' + '!important;'">
  <div [ngStyle]="{'width': verticalView[0] + 'px' }">
    <ngx-charts-line-chart
      *ngIf="itemModel.chartType === chartTypes.Line"
      [view]="verticalView"
      [scheme]="colorScheme"
      [customColors]="customColors"
      [results]="itemModel.chartData.multi"
      [legendPosition]="legendPosition"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="true"
      [yAxisLabel]="itemModel.calculateAverage ? ('Score' | translate) : ('Percents' | translate)"
      [yScaleMin]="0"
      [yScaleMax]="itemModel.calculateAverage ? 100 : 100">
    </ngx-charts-line-chart>
    <ngx-charts-bar-vertical
      *ngIf="itemModel.chartType === chartTypes.VerticalBar"
      [view]="verticalView"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.single"
      [customColors]="customColors"
      [legendPosition]="legendPosition"
      [barPadding]="barPadding"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="true"
      [yAxisLabel]="'Percents' | translate" [yScaleMax]="100">
    </ngx-charts-bar-vertical>
    <ngx-charts-bar-vertical-stacked
      *ngIf="itemModel.chartType === chartTypes.VerticalBarStacked"
      [view]="verticalView"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.multi"
      [customColors]="customColors"
      [legendPosition]="legendPosition"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="true"
      [yAxisLabel]="'Percents' | translate" [yScaleMax]="100">
    </ngx-charts-bar-vertical-stacked>
    <ngx-charts-bar-vertical-2d
      *ngIf="itemModel.chartType === chartTypes.VerticalBarGrouped"
      [view]="verticalView"
      [scheme]="colorScheme"
      [results]="itemModel.chartData.multi"
      [customColors]="customColors"
      [legendPosition]="legendPosition"
      [barPadding]="barPadding"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="true"
      [showXAxisLabel]="true"
      [showYAxisLabel]="true"
      [yAxisLabel]="'Percents' | translate" [yScaleMax]="100">
    </ngx-charts-bar-vertical-2d>
  </div>
</div>

<div class="scrollable-y-block mb-2"
     *ngIf="itemModel.chartType === chartTypes.HorizontalBarStackedGrouped">
  <div class="d-flex" id="copyableChart{{chartPosition}}" [style.background-color]="darkTHeme ? '' : '#FFFFFF' + '!important;'">
    <div
      [ngStyle]="{'width': multiChartView[0] + 'px' }"
      style="background-color: #FFFFFF !important;"
      *ngFor="let itemData of itemModel.chartData.multiStacked; let first = first; let last = last;"
    >
      <ngx-charts-bar-vertical-stacked
        [scheme]="colorScheme"
        [view]="multiChartView"
        [legendPosition]="legendPosition"
        [results]="itemData.series"
        [customColors]="customColors"
        [barPadding]="barPadding"
        [gradient]="false"
        [xAxis]="true"
        [yAxis]="true"
        [legend]="first"
        [animations]="false"
        [showXAxisLabel]="true"
        [showYAxisLabel]="true"
        [yAxisLabel]="'Percents' | translate"
        [xAxisLabel]="itemData.name"
        [yScaleMax]="100"></ngx-charts-bar-vertical-stacked>
    </div>
  </div>
</div>

<!--
  100% stacked vertical bars, one band per location or tag.

  Structurally the same flex row of per-band charts as the grouped chart above,
  with three differences: bar-vertical-normalized pins each bar to 100% by
  itself, the band label is an HTML element rather than xAxisLabel so it lines
  up across bands, and one shared legend sits under the whole row instead of
  inside the first band's box.
-->
<div class="scrollable-y-block mb-2"
     *ngIf="itemModel.chartType === chartTypes.VerticalBarStackedNormalizedGrouped">
  <div class="d-inline-flex flex-column insight-dashboard-banded-chart"
       id="copyableChart{{chartPosition}}"
       [class.insight-dashboard-banded-chart--light]="!darkTHeme">
    <div class="insight-dashboard-banded-chart__title" id="bandedChartTitle{{chartPosition}}">
      {{itemModel.firstQuestionName}}
    </div>
    <div class="d-flex">
      <div
        [ngStyle]="{'width': multiChartView[0] + 'px' }"
        *ngFor="let itemData of itemModel.chartData.multiStacked; let first = first;"
      >
        <ngx-charts-bar-vertical-normalized
          [scheme]="colorScheme"
          [view]="multiChartView"
          [results]="itemData.series"
          [customColors]="customColors"
          [barPadding]="barPadding"
          [gradient]="false"
          [xAxis]="true"
          [yAxis]="true"
          [legend]="false"
          [animations]="false"
          [showXAxisLabel]="false"
          [showYAxisLabel]="true"
          [yAxisLabel]="'Percents' | translate"></ngx-charts-bar-vertical-normalized>
        <div class="insight-dashboard-banded-chart__band-label"
             id="bandLabel{{chartPosition}}_{{itemData.name}}">
          {{bandLabel(itemData)}}
        </div>
      </div>
    </div>
    <ul class="insight-dashboard-banded-chart__legend" id="bandedChartLegend{{chartPosition}}">
      <li *ngFor="let entry of legendEntries">
        <span class="insight-dashboard-banded-chart__swatch"
              [style.background-color]="entry.value"></span>
        <span>{{entry.name}}</span>
      </li>
    </ul>
  </div>
</div>


<div class="d-flex flex-row">
  <button
    mat-icon-button
    class="mb-2"
    *ngIf="itemModel.chartType === chartTypes.VerticalBarStackedNormalizedGrouped"
    (click)="downloadChart()"
    id="downloadChart{{chartPosition}}"
    matTooltip="{{'Download as image' | translate}}"
    color="accent"
  >
    <mat-icon>image</mat-icon>
  </button>
  <button
    mat-icon-button
    class="mb-2"
    (click)="copyChart()"
    matTooltip="{{'Copy to clipboard' | translate}}"
    color="accent"
  >
    <mat-icon>content_copy</mat-icon>
  </button>
</div>
